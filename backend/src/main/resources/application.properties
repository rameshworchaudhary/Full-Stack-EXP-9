# Server Configuration
server.port=${PORT:8080}

# Application Metadata
spring.application.name=ci-quality-dashboard-backend

# Default Database Configuration (H2 In-Memory for local development & fast turnaround)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:cidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (disabled in production, enabled locally)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CI Ingestion Security Token
ci.ingestion.token=${CI_INGESTION_TOKEN:ci-secret-token-change-me}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
